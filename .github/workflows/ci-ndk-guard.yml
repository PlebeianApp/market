name: NDK Footprint Guard

# Prevents new @nostr-dev-kit usage while the NDK -> applesauce migration
# (docs/adr/ADR-0002-nostr-io-migration-ndk-to-applesauce.md) is in
# progress. New relay I/O must route through src/lib/nostr/io.ts instead.

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
  # No base-branch filter: PRs whose base is not `main`/`master` (stacked PRs
  # based on `auctions`, `security/**`, `pr/**`) were getting no check-suite at
  # all, because `pull_request.branches` matches the BASE ref of the PR.
  pull_request:
  workflow_dispatch:

jobs:
  footprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check NDK footprint
        run: bash scripts/check-ndk-footprint.sh
