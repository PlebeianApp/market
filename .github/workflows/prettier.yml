name: Prettier Check

on:
  push:
    branches: [main, master]
  # No base-branch filter: PRs whose base is not `main`/`master` (stacked PRs
  # based on `auctions`, `security/**`, `pr/**`) were getting no check-suite at
  # all, because `pull_request.branches` matches the BASE ref of the PR.
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check
