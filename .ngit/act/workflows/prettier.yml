# ngit (Nostr) CI copy of .github/workflows/prettier.yml.
#
# Unmodified from the GitHub original apart from this header: the file needs no
# adjustment for the `.ngit/act` runner (Linux `runs-on`, no `container:`, no
# job-level `uses:`, no `schedule:`). ngit-ci executes ONLY files under
# `.ngit/act/workflows/`, so this copy is what gives the repo CI on Nostr while
# GitHub keeps running the original.
#
name: Prettier Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check
