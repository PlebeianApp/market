# ngit (Nostr) CI copy of .github/workflows/ci-ndk-guard.yml.
#
# Unmodified from the GitHub original apart from this header: the file needs no
# adjustment for the `.ngit/act` runner (Linux `runs-on`, no `container:`, no
# job-level `uses:`, no `schedule:`). ngit-ci executes ONLY files under
# `.ngit/act/workflows/`, so this copy is what gives the repo CI on Nostr while
# GitHub keeps running the original.
#
name: NDK Footprint Guard

# Prevents new @nostr-dev-kit usage while the NDK -> applesauce migration
# (docs/adr/ADR-0002-nostr-io-migration-ndk-to-applesauce.md) is in
# progress. New relay I/O must route through src/lib/nostr/io.ts instead.

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'chore/**'
      - 'fix/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  footprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check NDK footprint
        run: bash scripts/check-ndk-footprint.sh
