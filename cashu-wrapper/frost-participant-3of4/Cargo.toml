[package]
name = "coco-demo-frost-participant-3of4-demo"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
publish = false

[dependencies]
chacha20poly1305 = "=0.10.1"
frost-secp256k1-tr = "=3.0.0"
fs2 = "=0.4.3"
hex = "=0.4.3"
k256 = { version = "=0.13.4", features = ["schnorr"] }
libc = "=0.2.190"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
zeroize = { version = "=1.9.1", features = ["derive"] }

[[bin]]
name = "coco-demo-frost-dkg-input-validator"
path = "src/dkg_input_validator_main.rs"
test = false
