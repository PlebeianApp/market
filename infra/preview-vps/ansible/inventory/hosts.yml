---
# Inventory for provisioning a Plebeian Market preview host.
#
# The host address comes from the same environment the Preview Deploy workflow
# reads, so the Ansible role and the workflow target the same box:
#   PREVIEW_VPS_HOST          hostname or IP (required)
#   PREVIEW_VPS_USER          ssh user (default: debian)
#   PREVIEW_VPS_SSH_KEY_FILE  private key path (default: ~/.ssh/preview_vps_deploy)
#   PREVIEW_VPS_PASSWORD      sudo password, only if the user is not NOPASSWD
all:
  hosts:
    preview:
      ansible_host: "{{ lookup('env', 'PREVIEW_VPS_HOST') }}"
      ansible_user: "{{ lookup('env', 'PREVIEW_VPS_USER') | default('debian', true) }}"
      ansible_ssh_private_key_file: "{{ lookup('env', 'PREVIEW_VPS_SSH_KEY_FILE') | default('~/.ssh/preview_vps_deploy', true) }}"
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
      ansible_become_password: "{{ lookup('env', 'PREVIEW_VPS_PASSWORD') | default('', true) }}"
