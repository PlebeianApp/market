<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Plebeian explorer — packages prototype</title>
		<style>
			body {
				background: #0b0b0f;
				color: #f4f4f5;
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				margin: 0;
				padding: 1.5rem;
			}
			.app-header h1 {
				font-size: 1.25rem;
				margin: 0 0 0.25rem;
			}
			.hint {
				color: #a1a1aa;
				font-size: 0.8rem;
				max-width: 70ch;
			}
			.tabs {
				display: flex;
				gap: 0.5rem;
				margin: 1rem 0;
			}
			.tab {
				background: #141419;
				border: 1px solid #27272a;
				border-radius: 8px;
				color: #f4f4f5;
				cursor: pointer;
				font-size: 0.85rem;
				padding: 0.4rem 0.75rem;
			}
			.tab--active {
				border-color: #f7931a;
				color: #f7931a;
			}
			.manifest-table {
				border-collapse: collapse;
				font-size: 0.75rem;
				margin: 1rem 0;
				width: 100%;
			}
			.manifest-table th,
			.manifest-table td {
				border: 1px solid #27272a;
				padding: 0.4rem 0.5rem;
				text-align: left;
				vertical-align: top;
			}
			.manifest-table th {
				color: #a1a1aa;
				font-weight: 600;
			}
			code {
				color: #f7931a;
			}
			label {
				font-size: 0.8rem;
			}
			select,
			button {
				background: #141419;
				border: 1px solid #27272a;
				border-radius: 6px;
				color: #f4f4f5;
				font-size: 0.8rem;
				padding: 0.25rem 0.5rem;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<!--
			Diagnostic aid: the prototype's failure mode of interest is a module-level throw, which the
			browser reports only to the console. Capturing it on `window.__bootsErrors` makes it readable
			from a DOM inspection, so a headless check can tell "the bundle failed" from "no data".
		-->
		<script>
			window.__bootsErrors = []
			window.addEventListener('error', (e) => window.__bootsErrors.push(String(e.message || e.error)))
			window.addEventListener('unhandledrejection', (e) => window.__bootsErrors.push('rejection: ' + String(e.reason)))
		</script>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
