# Public fake-sat demo request controls. Loaded in nginx's http context.
#
# The Friday trust API uses POST for exact, body-bound reads. Keep those reads
# under the ordinary per-IP, global, per-user and connection limits without
# charging the much smaller mutation budget. Unknown POST routes and every
# actual state-changing route remain mutation-limited by default.
map "$request_method:$uri" $plebeian_friday_mutation_ip {
    ~^(?:GET|HEAD|OPTIONS): "";
    ~^POST:/api/friday/(?:deployment|auction-funding/read|seller-plan/(?:challenge|pending|read)|terminal/read|funding/status|funding-abort/status)$ "";
    default $binary_remote_addr;
}
map "$request_method:$uri" $plebeian_friday_mutation_global {
    ~^(?:GET|HEAD|OPTIONS): "";
    ~^POST:/api/friday/(?:deployment|auction-funding/read|seller-plan/(?:challenge|pending|read)|terminal/read|funding/status|funding-abort/status)$ "";
    default public-demo;
}
map $host $plebeian_friday_global {
    default public-demo;
}

limit_req_zone $binary_remote_addr zone=plebeian_friday_per_ip:10m rate=5r/s;
limit_req_zone $plebeian_friday_global zone=plebeian_friday_global:1m rate=20r/s;
limit_req_zone $plebeian_friday_mutation_ip zone=plebeian_friday_mutation_ip:10m rate=12r/m;
limit_req_zone $plebeian_friday_mutation_global zone=plebeian_friday_mutation_global:1m rate=30r/m;
limit_req_zone $remote_user zone=plebeian_friday_per_user:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=plebeian_friday_connections:10m;
limit_conn_zone $remote_user zone=plebeian_friday_user_connections:1m;
