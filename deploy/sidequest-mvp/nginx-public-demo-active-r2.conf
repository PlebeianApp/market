# Exact NUT-17 endpoint; inherit all server request and connection limits.
# Do not add location-level limit_req/limit_conn directives (they replace inheritance).
location = /v1/ws {
    limit_except GET { deny all; }
    proxy_pass http://[fdb2:77a9:c591:3ac6:3513:5bf8:cc3b:5a04]:3438;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host 139.162.161.233;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_redirect off;
    proxy_cache off;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}

location ^~ /v1/ {
    limit_except GET POST { deny all; }
    proxy_pass http://[fdb2:77a9:c591:3ac6:3513:5bf8:cc3b:5a04]:3438;
    proxy_http_version 1.1;
    proxy_set_header Host 139.162.161.233;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    # The hardened browser wallet validates the exact identity-encoded mint
    # response. Browsers do not allow application code to set Accept-Encoding,
    # so terminate content negotiation at this same-origin proxy.
    proxy_set_header Accept-Encoding "";

    proxy_redirect off;
    proxy_intercept_errors on;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    add_header Cache-Control "no-store" always;
}

location ^~ /api/friday/ {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:8181;
    proxy_http_version 1.1;
    proxy_set_header Host 139.162.161.233;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 32k;
    add_header Cache-Control "no-store" always;
}

# The application already refuses this in remote mode. Deny it again at the
# public edge so the operator-only fault-control name is never proxied.
location = /api/admin/offline { return 404; }
location = /api/close { return 404; }
location = /api/interim/faucet { return 404; }
location ^~ /api/cashu/ { return 404; }
location ~ /\. { return 404; }

location / {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:8180;
    proxy_http_version 1.1;
    proxy_set_header Host 139.162.161.233;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 32k;
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data: https:; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;
}
