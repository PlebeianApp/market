server {
    listen 172.105.64.142:443 ssl;
    server_name 172.105.64.142;

    ssl_certificate     /etc/plebeian-auctions-poc/acme/certificates/172.105.64.142.crt;
    ssl_certificate_key /etc/plebeian-auctions-poc/acme/certificates/172.105.64.142.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
